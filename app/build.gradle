plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.build.buildexpress'
    compileSdk 34

    defaultConfig {
        applicationId "com.build.buildexpress"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    // REQUIRED: the codebase uses lambdas (v -> ...) in 21 places.
    // Without this, AGP defaults can reject them -> "lambda expressions are
    // not supported at language level 7".
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "BuildExpress-${variant.name}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'

    // --- ADDED: used in code + XML but missing from the original build file ---
    implementation 'androidx.viewpager2:viewpager2:1.1.0'          // ViewPager2 (2 files, 2 layouts)
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'      // DrawerLayout (1 file, 1 layout)
    implementation 'androidx.cardview:cardview:1.0.0'              // CardView (37 layouts)
    implementation 'androidx.core:core:1.13.1'                     // ContextCompat/FileProvider
    implementation 'androidx.annotation:annotation:1.8.0'
    // -------------------------------------------------------------------------

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    // Shimmer
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    // ML Kit OCR
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.0'
}
