# JVM heap for the Gradle daemon.
# The previous OOM (java_pid*.hprof, ~487MB) came from too small a heap.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

android.useAndroidX=true
# Jetifier is only needed for old support-library artifacts. Nothing here uses
# them, and leaving it on massively slows the build.
android.enableJetifier=false

org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
android.nonTransitiveRClass=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
